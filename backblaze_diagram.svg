<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="760" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="10" y="40" width="250" height="170" rx="10" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="2"/><text x="24" y="68" font-size="17" font-weight="700">1. Ingest</text><text x="24" y="92" font-size="14" fill="#333">Raw data: video, audio, text,</text><text x="24" y="113" font-size="14" fill="#333">sensor logs (example sources)</text><text x="24" y="134" font-size="14" fill="#333">S3 PUT or Backblaze Universal</text><text x="24" y="155" font-size="14" fill="#333">Data Migration into B2 [19]</text><text x="24" y="176" font-size="14" fill="#333">No upload fees; free transactions [23][12]</text>
<rect x="320" y="20" width="400" height="250" rx="10" fill="#fff3cd" stroke="#1a1a1a" stroke-width="2"/><text x="334" y="48" font-size="17" font-weight="700">2. Backblaze B2 / B2 Overdrive</text><text x="334" y="72" font-size="14" fill="#333">System of record, S3-compatible API [14]</text><text x="334" y="93" font-size="14" fill="#333">Buckets: raw, curated shards, checkpoints</text><text x="334" y="114" font-size="14" fill="#333">B2: from $6.95/TB/mo, 3x free egress [1][3]</text><text x="334" y="135" font-size="14" fill="#333">Overdrive: from $15/TB/mo, 100Gbps-1Tbps,</text><text x="334" y="156" font-size="14" fill="#333">  dedicated hardware + private networking [2][6][8][9]</text><text x="334" y="177" font-size="14" fill="#333">Overdrive: free egress to any destination [7]</text><text x="334" y="198" font-size="14" fill="#333">Overdrive minimum: 1PB (FAQ) vs multi-PB</text><text x="334" y="219" font-size="14" fill="#333">  (pricing page) - confirm in discovery [10][11]</text>
<rect x="880" y="40" width="250" height="210" rx="10" fill="#e8f0fe" stroke="#1a1a1a" stroke-width="2"/><text x="894" y="68" font-size="17" font-weight="700">3. CoreWeave GPU cluster</text><text x="894" y="92" font-size="14" fill="#333">Existing customer compute</text><text x="894" y="113" font-size="14" fill="#333">Data loaders stream shards</text><text x="894" y="134" font-size="14" fill="#333">over the S3 API</text><text x="894" y="155" font-size="14" fill="#333">Local NVMe / cache: customer-</text><text x="894" y="176" font-size="14" fill="#333">owned, not Backblaze (example)</text><text x="894" y="197" font-size="14" fill="#333">Writes checkpoints every N</text><text x="894" y="218" font-size="14" fill="#333">steps (N = example)</text>
<line x1="260" y1="125" x2="318" y2="125" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/><text x="289.0" y="117.0" font-size="13" text-anchor="middle" fill="#444">PUT</text>
<line x1="722" y1="105" x2="878" y2="105" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/><text x="800.0" y="97.0" font-size="13" text-anchor="middle" fill="#444">training reads</text>
<text x="800" y="140" font-size="12" text-anchor="middle" fill="#0a6">$0 egress: CoreWeave is a</text>
<text x="800" y="155" font-size="12" text-anchor="middle" fill="#0a6">listed free-egress partner [5]</text>
<line x1="878" y1="215" x2="722" y2="215" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/><text x="800.0" y="235.0" font-size="13" text-anchor="middle" fill="#444">checkpoints (PUT)</text>
<rect x="320" y="340" width="400" height="170" rx="10" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="2"/><text x="334" y="368" font-size="17" font-weight="700">4. Archive and recovery</text><text x="334" y="392" font-size="14" fill="#333">Older checkpoints + final weights stay in B2</text><text x="334" y="413" font-size="14" fill="#333">Object Lock (WORM) for immutability [17]</text><text x="334" y="434" font-size="14" fill="#333">Cloud Replication to a 2nd region, no</text><text x="334" y="455" font-size="14" fill="#333">  service or egress fees [18]</text><text x="334" y="476" font-size="14" fill="#333">No storage-duration fees on deletes [13]</text>
<line x1="520" y1="272" x2="520" y2="338" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/><text x="530" y="310" font-size="13" fill="#444">retain / lock / replicate</text>
<rect x="880" y="340" width="250" height="170" rx="10" fill="#e8f0fe" stroke="#1a1a1a" stroke-width="2"/><text x="894" y="368" font-size="17" font-weight="700">5. Resume or move</text><text x="894" y="392" font-size="14" fill="#333">Restart a failed run from the</text><text x="894" y="413" font-size="14" fill="#333">latest checkpoint in B2</text><text x="894" y="434" font-size="14" fill="#333">Or move to another GPU cloud:</text><text x="894" y="455" font-size="14" fill="#333">non-partner egress is free up</text><text x="894" y="476" font-size="14" fill="#333">to 3x stored, then $0.01/GB [3][4]</text>
<line x1="722" y1="425" x2="878" y2="425" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/><text x="800.0" y="417.0" font-size="13" text-anchor="middle" fill="#444">restore</text>
<rect x="10" y="560" width="1120" height="170" rx="10" fill="#fff" stroke="#bbb" stroke-dasharray="6,5"/>
<text x="26" y="590" font-size="16" font-weight="700">Where the egress math flips (list prices, decimal TB, no discounts)</text>
<text x="26" y="618" font-size="14" fill="#333">To CoreWeave (partner): reads are free on standard B2, so Overdrive is a throughput decision, not a cost one.</text>
<text x="26" y="642" font-size="14" fill="#333">To a non-partner cloud: B2 costs $6.95/TB + $10/TB for reads past 3x; Overdrive costs $15/TB flat.</text>
<text x="26" y="666" font-size="14" fill="#333">Break-even = 3 + (15 - 6.95) / 10 = <tspan font-weight="700">3.81 full dataset reads per month</tspan>. Above that, Overdrive's list price is lower.</text>
<text x="26" y="690" font-size="14" fill="#333">Example (not a customer): 2,000 TB read 4x/month to a non-partner cloud = B2 $33,900 vs Overdrive $30,000; on CoreWeave B2 = $13,900.</text>
<text x="26" y="714" font-size="12" fill="#777">Numbers in [brackets] map to the sources list on the page. Since June 2026 Backblaze also supports HDD tiers inside CoreWeave AI Object Storage [21], a second path to discuss.</text>
</svg>