<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 150" font-family="Helvetica,Arial,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="20" y="25" width="165" height="100" rx="8" fill="#f5f5f5" stroke="#bbb"/><text x="102" y="55" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">1. New signup</text><text x="102" y="80" font-size="13" text-anchor="middle" fill="#444">work email + title</text><text x="102" y="97" font-size="13" text-anchor="middle" fill="#444">(sample input)</text><line x1="188" y1="75" x2="196" y2="75" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="199" y="25" width="165" height="100" rx="8" fill="#f5f5f5" stroke="#bbb"/><text x="282" y="55" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">2. Resolve company</text><text x="282" y="80" font-size="13" text-anchor="middle" fill="#444">domain to public job</text><text x="282" y="97" font-size="13" text-anchor="middle" fill="#444">board</text><line x1="367" y1="75" x2="375" y2="75" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="378" y="25" width="165" height="100" rx="8" fill="#fff3cd" stroke="#bbb"/><text x="460" y="55" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">3. Signal check</text><text x="460" y="80" font-size="13" text-anchor="middle" fill="#444">open sales roles; posts</text><text x="460" y="97" font-size="13" text-anchor="middle" fill="#444">naming Snowflake /</text><text x="460" y="114" font-size="13" text-anchor="middle" fill="#444">Databricks</text><line x1="546" y1="75" x2="554" y2="75" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="557" y="25" width="165" height="100" rx="8" fill="#fff3cd" stroke="#bbb"/><text x="640" y="55" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">4. Readiness score</text><text x="640" y="80" font-size="13" text-anchor="middle" fill="#444">0-6 heuristic</text><line x1="725" y1="75" x2="733" y2="75" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="736" y="25" width="165" height="100" rx="8" fill="#f5f5f5" stroke="#bbb"/><text x="818" y="55" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">5. Route</text><text x="818" y="80" font-size="13" text-anchor="middle" fill="#444">5+ AE handoff, 3-4 BDR</text><text x="818" y="97" font-size="13" text-anchor="middle" fill="#444">nurture, 0-2 self-serve</text><line x1="904" y1="75" x2="912" y2="75" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="915" y="25" width="165" height="100" rx="8" fill="#f5f5f5" stroke="#bbb"/><text x="998" y="55" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">6. Output</text><text x="998" y="80" font-size="13" text-anchor="middle" fill="#444">AE handoff note +</text><text x="998" y="97" font-size="13" text-anchor="middle" fill="#444">first-touch draft</text></svg>